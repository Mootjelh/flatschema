name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 1.21 is the minimum go.mod claims. Testing it keeps that claim true.
        go: ['1.21', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Short by design. The point is that arbitrary input never panics, and
      # a regression in that shows up in seconds, not hours.
      - run: go test -run=NONE -fuzz=FuzzReader -fuzztime=60s .

  flatc:
    name: flatc compiles the output
    runs-on: ubuntu-latest
    env:
      # Without this the test skips when flatc is missing, and a skipped check
      # is a green tick that means nothing.
      FLATSCHEMA_REQUIRE_FLATC: '1'
      FLATC_VERSION: '25.12.19'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install flatc
        run: |
          url="https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip"
          curl -fsSL "$url" -o flatc.zip
          unzip -q flatc.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/flatc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: flatc --version
      - run: go test -run Flatc -v ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
